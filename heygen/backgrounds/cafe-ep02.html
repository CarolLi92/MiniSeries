<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#e9dccb}
#scene{position:absolute;inset:0;filter:blur(7px) saturate(1.05);transform:scale(1.03)}
.wall{position:absolute;inset:0;background:linear-gradient(180deg,#efe3d2 0%,#e6d4bd 62%,#d9c2a5 100%)}
.panel{position:absolute;left:0;right:0;top:640px;height:440px;background:repeating-linear-gradient(90deg,#c9a882 0 34px,#bf9c75 34px 38px)}
.counter{position:absolute;left:0;right:0;top:700px;height:40px;background:linear-gradient(180deg,#f4efe9,#ddd5cb)}
.arch{position:absolute;top:150px;width:360px;height:520px;border-radius:180px 180px 0 0;background:linear-gradient(180deg,#d4a98b,#c48f72)}
.mirror{position:absolute;top:190px;width:300px;height:470px;border-radius:150px 150px 0 0;background:linear-gradient(160deg,#f6efe6,#cfc0ad 70%,#bda88f);border:10px solid #b88b4a;box-sizing:border-box}
.shelf{position:absolute;height:14px;background:#a77b4f;border-radius:3px}
.cup{position:absolute;width:46px;height:52px;border-radius:4px 4px 18px 18px}
.pendant{position:absolute;top:0;width:3px;background:#3a2c22}
.shade{position:absolute;width:120px;height:70px;border-radius:120px 120px 10px 10px;background:#2f2721}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.95) 0%,rgba(255,200,130,.45) 25%,rgba(255,190,120,0) 65%)}
.neon{position:absolute;top:250px;left:1090px;font:italic 400 80px "Brush Script MT","Snell Roundhand",cursive;color:#fff2f6;text-shadow:0 0 10px #ff9ec4,0 0 25px #ff6fa8,0 0 50px #ff4f93,0 0 90px #ff4f93}
.leaf{position:absolute;border-radius:0 70% 0 70%;background:linear-gradient(135deg,#5f8d4e,#2f5e33)}
.pot{position:absolute;border-radius:6px 6px 30px 30px;background:#efe9e1}
.window{position:absolute;top:120px;left:1620px;width:300px;height:560px;background:linear-gradient(180deg,#fff8ea,#f6e6c8);box-shadow:0 0 120px 60px rgba(255,240,210,.7)}
</style></head><body><div id="scene">
<div class="wall"></div><div class="window"></div>
<div class="arch" style="left:150px"></div>
<div class="mirror" style="left:180px"></div>
<div class="shelf" style="left:620px;top:330px;width:420px"></div>
<div class="shelf" style="left:620px;top:480px;width:420px"></div>
<div class="neon">but first, coffee</div>
<div class="panel"></div><div class="counter"></div>
<div class="glow" style="left:430px;top:40px"></div>
<div class="glow" style="left:1110px;top:20px"></div>
<div class="glow" style="left:1520px;top:60px;opacity:.7"></div>
<div class="pendant" style="left:640px;height:150px"></div><div class="shade" style="left:581px;top:150px"></div>
<div class="pendant" style="left:1320px;height:120px"></div><div class="shade" style="left:1261px;top:120px"></div>
</div>
<script>
const s=document.getElementById('scene');
const cols=['#f3ede4','#d98e73','#9fb7a6','#e8c27a','#ffffff','#c7a7d8'];
let i=0;for(const y of [278,428])for(let x=640;x<1010;x+=62){const c=document.createElement('div');c.className='cup';c.style.left=x+'px';c.style.top=y+'px';c.style.background=cols[i++%cols.length];s.appendChild(c);}
function plant(px,py,scale,n){const p=document.createElement('div');p.className='pot';p.style.cssText+=`left:${px-60*scale}px;top:${py}px;width:${120*scale}px;height:${110*scale}px`;
 for(let k=0;k<n;k++){const l=document.createElement('div');l.className='leaf';const a=-70+140*k/(n-1)+(Math.random()*16-8);const L=(150+Math.random()*90)*scale;
 l.style.cssText+=`left:${px}px;top:${py-L*0.95}px;width:${L*0.55}px;height:${L}px;transform-origin:0 100%;transform:rotate(${a}deg)`;s.appendChild(l);}s.appendChild(p);}
plant(110,560,1.3,9);plant(1600,610,1.0,8);plant(1860,620,1.2,9);plant(980,600,.6,6);
</script></body></html>
